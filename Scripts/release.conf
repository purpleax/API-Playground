# Settings for building and releasing the app. Read by make-app.sh and release.sh.
# Nothing here is secret: the private keys stay in the login Keychain.

# The version users see, and the build number. Raise both for every release:
# Sparkle compares build numbers to decide whether a download is newer.
VERSION="0.3.3"
BUILD="6"

# Where the update feed (appcast.xml) will be hosted, for example
# https://example.com/api-playground/appcast.xml. The downloads sit beside it.
# While this is empty the app is built without updates, and has no "Check for Updates…".
# This address always serves the appcast.xml attached to the newest GitHub release.
FEED_URL="https://github.com/purpleax/API-Playground/releases/latest/download/appcast.xml"

# Where the feed says each version's disk image is: the GitHub release tagged v<version>.
# Empty means beside the feed.
DOWNLOAD_PREFIX="https://github.com/purpleax/API-Playground/releases/download/v$VERSION/"

# The public half of the key updates are signed with. The private half is in the login
# Keychain under this account name; export a backup with:
#   .build/artifacts/sparkle/Sparkle/bin/generate_keys --account api-playground -x FILE
SPARKLE_PUBLIC_KEY="8jozsDg6G8Ak3M0JsjptiPtr7ILIciiJ8PDwbcK2j5A="
SPARKLE_KEY_ACCOUNT="api-playground"

# The Keychain profile holding the Apple ID sign-in for notarisation. Create it once with:
#   xcrun notarytool store-credentials api-playground-notary
NOTARY_PROFILE="api-playground-notary"

# The certificate to sign with. Empty means the first "Developer ID Application"
# certificate in the Keychain.
SIGN_IDENTITY=""
